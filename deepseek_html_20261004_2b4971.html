<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Pixel Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #70c5ce; font-family: 'Press Start 2P', cursive; }
        canvas { display: block; image-rendering: pixelated; }
        .btn {
            position: absolute; z-index: 10; padding: 8px 10px;
            background: #fff; border: 4px solid #000; cursor: pointer;
            font-family: 'Press Start 2P', cursive; font-size: 12px; color: #000;
        }
        .btn:hover { background: #f7d51d; }
        .btn:active { background: #c9a614; }
        #fullscreenBtn { top: 10px; left: 10px; }
        #settingsBtn { top: 10px; right: 10px; font-size: 14px; }
        #pauseBtn { top: 10px; left: 50%; transform: translateX(-50%); }

        #musicIndicator {
            position: fixed; bottom: 10px; right: 10px; z-index: 10;
            padding: 6px 10px; background: rgba(0,0,0,0.7); color: #f7d51d;
            border: 2px solid #fff; font-family: 'Press Start 2P', cursive;
            font-size: 8px; pointer-events: none;
        }

        #settingsMenu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 100; display: none;
            justify-content: center; align-items: center;
        }
        #settingsMenu.active { display: flex; }
        .settings-panel {
            background: #fff; border: 6px solid #000; padding: 20px;
            width: 90%; max-width: 450px; box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
        }
        .settings-title { text-align: center; font-size: 16px; margin-bottom: 20px; color: #000; }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            margin: 12px 0; font-size: 10px; color: #000;
        }
        .setting-btn {
            padding: 6px 10px; background: #f7d51d; border: 3px solid #000;
            cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 10px;
        }
        .setting-btn:hover { background: #fce770; }
        .setting-btn.off { background: #ccc; }
        .close-btn {
            display: block; width: 100%; margin-top: 20px; padding: 10px;
            background: #ff4444; color: #fff; border: 4px solid #000;
            cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 12px;
        }
        .close-btn:hover { background: #ff6666; }
    </style>
</head>
<body>

<button class="btn" id="fullscreenBtn">⛶</button>
<button class="btn" id="pauseBtn">II</button>
<button class="btn" id="settingsBtn">⚙</button>

<div id="musicIndicator">♪ OFF</div>

<div id="settingsMenu">
    <div class="settings-panel">
        <div class="settings-title">SETTINGS</div>
        <div class="setting-row">
            <span>MUSIC</span>
            <button class="setting-btn" id="musicToggle">ON</button>
        </div>
        <div class="setting-row">
            <span>SOUND FX</span>
            <button class="setting-btn" id="sfxToggle">ON</button>
        </div>
        <div class="setting-row">
            <span>DAY/NIGHT</span>
            <button class="setting-btn" id="themeToggle">DAY</button>
        </div>
        <div class="setting-row">
            <span>DIFFICULTY</span>
            <button class="setting-btn" id="diffToggle">NORMAL</button>
        </div>
        <button class="close-btn" id="closeSettings">CLOSE</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    // === ГЛОБАЛЬНЫЙ ОТЛОВ ОШИБОК ===
    window.onerror = function(msg, url, line) {
        console.error('JS Error:', msg, 'line', line);
        return true;
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
    ctx.mozImageSmoothingEnabled = false;

    // === НАСТРОЙКИ ===
    const settings = {
        music: true,
        sfx: true,
        theme: 'day',
        difficulty: 'normal',
    };

    function loadSettings() {
        try {
            const saved = localStorage.getItem('flappySettings');
            if (saved) Object.assign(settings, JSON.parse(saved));
        } catch(e) {}
        updateSettingsUI();
    }

    function saveSettings() {
        try {
            localStorage.setItem('flappySettings', JSON.stringify(settings));
        } catch(e) {}
    }

    // === АУДИО ===
    let audioCtx = null;
    let musicPlaying = false;
    let musicInterval = null;
    let musicNoteIdx = 0;
    let lastNoteTime = 0;
    let audioInitialized = false;

    const musicIndicator = document.getElementById('musicIndicator');

    const melody = [
        {f: 659.25, d: 150}, {f: 659.25, d: 150}, {f: 0, d: 150}, {f: 659.25, d: 150},
        {f: 0, d: 150}, {f: 523.25, d: 150}, {f: 659.25, d: 150}, {f: 0, d: 150},
        {f: 783.99, d: 300}, {f: 0, d: 300},
        {f: 659.25, d: 150}, {f: 659.25, d: 150}, {f: 0, d: 150}, {f: 587.33, d: 150},
        {f: 0, d: 150}, {f: 523.25, d: 150}, {f: 440.00, d: 150}, {f: 0, d: 150},
        {f: 493.88, d: 300}, {f: 0, d: 300},
        {f: 523.25, d: 150}, {f: 659.25, d: 150}, {f: 783.99, d: 150}, {f: 0, d: 150},
        {f: 880.00, d: 150}, {f: 783.99, d: 150}, {f: 659.25, d: 150}, {f: 0, d: 150},
        {f: 587.33, d: 150}, {f: 493.88, d: 150}, {f: 523.25, d: 300},
        {f: 659.25, d: 150}, {f: 587.33, d: 150}, {f: 523.25, d: 150}, {f: 440.00, d: 150},
        {f: 493.88, d: 150}, {f: 523.25, d: 150}, {f: 587.33, d: 150}, {f: 659.25, d: 150},
        {f: 523.25, d: 600},
    ];

    function initAudio() {
        if (audioInitialized) {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return;
        }
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
            audioInitialized = true;
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        } catch(e) { audioInitialized = true; }
    }

    function playTone(freq, duration, type, volume) {
        if (!audioCtx || freq === 0) return;
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.value = freq;
            const now = audioCtx.currentTime;
            const endTime = now + duration / 1000;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.01);
            gain.gain.setValueAtTime(volume, now + duration / 1000 * 0.6);
            gain.gain.linearRampToValueAtTime(0, endTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(endTime + 0.05);
        } catch(e) {}
    }

    function startMusic() {
        if (!settings.music || musicPlaying) return;
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        
        musicPlaying = true;
        musicNoteIdx = 0;
        lastNoteTime = 0;
        updateMusicIndicator();
        
        musicInterval = setInterval(() => {
            if (!musicPlaying || !settings.music || !audioCtx) {
                stopMusic();
                return;
            }
            const now = Date.now();
            if (now - lastNoteTime < melody[musicNoteIdx].d * 0.85) return;
            lastNoteTime = now;
            
            const note = melody[musicNoteIdx];
            if (note.f > 0) playTone(note.f, note.d * 0.8, 'square', 0.06);
            
            musicNoteIdx++;
            if (musicNoteIdx >= melody.length) musicNoteIdx = 0;
        }, 50);
    }

    function stopMusic() {
        musicPlaying = false;
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
        updateMusicIndicator();
    }

    function updateMusicIndicator() {
        if (musicPlaying && settings.music) {
            musicIndicator.textContent = '♪ PLAYING';
            musicIndicator.style.color = '#5cb82e';
        } else {
            musicIndicator.textContent = '♪ OFF';
            musicIndicator.style.color = '#ff4444';
        }
    }

    function sfxJump() {
        if (!audioCtx || !settings.sfx) return;
        playTone(600, 80, 'square', 0.1);
        setTimeout(() => { if (audioCtx && settings.sfx) playTone(800, 60, 'square', 0.07); }, 30);
    }
    function sfxScore() {
        if (!audioCtx || !settings.sfx) return;
        playTone(880, 60, 'square', 0.09);
        setTimeout(() => { if (audioCtx && settings.sfx) playTone(1174.66, 100, 'square', 0.09); }, 50);
    }
    function sfxHit() {
        if (!audioCtx || !settings.sfx) return;
        playTone(200, 200, 'sawtooth', 0.12);
        setTimeout(() => { if (audioCtx && settings.sfx) playTone(100, 300, 'sawtooth', 0.12); }, 100);
    }
    function sfxClick() {
        if (!audioCtx || !settings.sfx) return;
        playTone(500, 50, 'square', 0.07);
    }

    // === РАЗМЕРЫ ===
    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    const LOGICAL_HEIGHT = 180;
    let scale = 1;
    let logicalWidth = 0;
    let logicalHeight = 0;

    function resizeCanvas() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        scale = Math.max(1, Math.floor(canvasHeight / LOGICAL_HEIGHT));
        logicalWidth = Math.ceil(canvasWidth / scale);
        logicalHeight = Math.ceil(canvasHeight / scale);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // === СЛОЖНОСТЬ ===
    const DIFFICULTY = {
        easy:   { pipeGap: 55, pipeSpeed: 1.3, spawnInterval: 110 },
        normal: { pipeGap: 45, pipeSpeed: 1.5, spawnInterval: 90 },
        hard:   { pipeGap: 38, pipeSpeed: 1.8, spawnInterval: 75 },
    };

    let PIPE_GAP = 45;
    let PIPE_SPEED = 1.5;
    let PIPE_SPAWN_INTERVAL = 90;

    function applyDifficulty() {
        const d = DIFFICULTY[settings.difficulty] || DIFFICULTY.normal;
        PIPE_GAP = d.pipeGap;
        PIPE_SPEED = d.pipeSpeed;
        PIPE_SPAWN_INTERVAL = d.spawnInterval;
    }

    const GRAVITY = 0.25;
    const JUMP_STRENGTH = -3.8;
    const MAX_FALL_SPEED = 5.0;
    const PIPE_WIDTH = 16;
    const GROUND_HEIGHT = 20;

    let frames = 0;
    let score = 0;
    let gameState = 'ready';
    let prevGameState = 'ready';

    // === ПТИЦА ===
    const bird = {
        x: 30, y: 50, width: 10, height: 8,
        velocity: 0, rotation: 0, frame: 0,
        wingFrames: [
            { y: -2, h: 3, w: 5 }, { y: -1, h: 3, w: 5 },
            { y: 0, h: 3, w: 5 }, { y: 2, h: 3, w: 4 }
        ],
        draw: function() {
            ctx.save();
            ctx.translate(Math.floor(this.x + this.width/2), Math.floor(this.y + this.height/2));
            ctx.rotate(this.rotation);
            const w = this.width, h = this.height;
            const x = -Math.floor(w/2), y = -Math.floor(h/2);

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(x + 1, y + 1, w, h);
            ctx.fillStyle = '#c9a614';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#f7d51d';
            ctx.fillRect(x, y + 1, w - 1, h - 2);
            ctx.fillRect(x + 1, y, w - 2, h - 1);
            ctx.fillStyle = '#fce770';
            ctx.fillRect(x + 1, y, w - 4, 2);
            ctx.fillStyle = '#fceea0';
            ctx.fillRect(x + 1, y + h - 3, w - 2, 2);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);

            // Хвост
            ctx.fillStyle = '#f7d51d';
            ctx.fillRect(x - 2, y + 3, 2, 1);
            ctx.fillRect(x - 2, y + 5, 2, 1);
            ctx.strokeRect(x - 2, y + 3, 2, 1);
            ctx.strokeRect(x - 2, y + 5, 2, 1);

            // Скругление головы
            ctx.fillStyle = '#f7d51d';
            ctx.fillRect(x, y - 1, 2, 1);
            ctx.fillRect(x + 4, y - 1, w - 6, 1);
            ctx.fillRect(x + w - 2, y - 1, 2, 1);

            // Глаз
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 4, y + 1, 4, 4);
            ctx.strokeRect(x + 4, y + 1, 4, 4);
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 6, y + 2, 2, 2);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 7, y + 2, 1, 1);

            // Щёчка
            ctx.fillStyle = 'rgba(255, 150, 150, 0.5)';
            ctx.fillRect(x + 3, y + 4, 2, 1);

            // Клюв
            ctx.fillStyle = '#ff8800';
            ctx.fillRect(x + w - 1, y + 3, 3, 1);
            ctx.fillRect(x + w + 1, y + 4, 2, 1);
            ctx.fillStyle = '#cc5500';
            ctx.fillRect(x + w - 1, y + 4, 3, 1);
            ctx.fillRect(x + w, y + 5, 2, 1);
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(x + w - 1, y + 3);
            ctx.lineTo(x + w + 3, y + 4);
            ctx.lineTo(x + w + 3, y + 5);
            ctx.lineTo(x + w + 2, y + 6);
            ctx.lineTo(x + w - 1, y + 6);
            ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.fillRect(x + w + 1, y + 3, 1, 1);

            // Крыло
            const wing = this.wingFrames[this.frame];
            const wingX = x - 1;
            const wingY = y + 3 + wing.y;
            const wingW = wing.w;
            const wingH = wing.h;

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(wingX + 1, wingY + 1, wingW, wingH);
            ctx.fillStyle = '#fff';
            ctx.fillRect(wingX, wingY, wingW, wingH);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(wingX + 1, wingY, wingW - 2, 1);
            ctx.fillStyle = '#d0d0d0';
            ctx.fillRect(wingX + 1, wingY + wingH - 1, wingW - 1, 1);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(wingX, wingY, wingW, wingH);

            ctx.restore();
        },
        update: function() {
            if (gameState === 'play') {
                this.velocity += GRAVITY;
                if (this.velocity > MAX_FALL_SPEED) this.velocity = MAX_FALL_SPEED;
                this.y += this.velocity;
                if (this.velocity < 0) this.rotation = -0.3;
                else this.rotation = Math.min(Math.PI / 2, this.velocity * 0.1);
                if (frames % 4 === 0) this.frame = (this.frame + 1) % 4;
                if (this.y + this.height >= logicalHeight - GROUND_HEIGHT) {
                    this.y = logicalHeight - GROUND_HEIGHT - this.height;
                    gameOver();
                }
                if (this.y < 0) { this.y = 0; this.velocity = 0; }
            } else if (gameState === 'ready') {
                this.y = 50 + Math.sin(frames * 0.1) * 3;
                this.rotation = 0;
                if (frames % 8 === 0) this.frame = (this.frame + 1) % 4;
            }
        },
        jump: function() {
            if (gameState === 'ready') {
                gameState = 'play';
                this.velocity = JUMP_STRENGTH;
                sfxJump();
                if (settings.music) startMusic();
            } else if (gameState === 'play') {
                this.velocity = JUMP_STRENGTH;
                sfxJump();
            } else if (gameState === 'over') {
                resetGame();
            }
        }
    };

    const pipes = [];

    function createPipe() {
        const minH = 15;
        const maxH = logicalHeight - GROUND_HEIGHT - PIPE_GAP - minH;
        const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
        pipes.push({ x: logicalWidth, y: 0, w: PIPE_WIDTH, h: topH, passed: false });
        pipes.push({ x: logicalWidth, y: topH + PIPE_GAP, w: PIPE_WIDTH, h: logicalHeight - topH - PIPE_GAP - GROUND_HEIGHT, passed: false });
    }

    function drawPipes() {
        pipes.forEach(pipe => {
            const x = Math.floor(pipe.x);
            const y = Math.floor(pipe.y);
            const w = pipe.w;
            const h = pipe.h;

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(x + 2, y + 2, w, h);
            ctx.fillStyle = '#5cb82e';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#8fe350';
            ctx.fillRect(x + 2, y, 3, h);
            ctx.fillStyle = '#a8f070';
            ctx.fillRect(x + 6, y, 1, h);
            ctx.fillStyle = '#2e7d1e';
            ctx.fillRect(x + w - 3, y, 3, h);
            ctx.strokeStyle = '#1a4d12';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);

            const capHeight = 6;
            const capWidth = w + 4;
            const capX = x - 2;
            let capY = (pipe.y === 0) ? y + h - capHeight : y;

            ctx.fillStyle = '#5cb82e';
            ctx.fillRect(capX, capY, capWidth, capHeight);
            ctx.fillStyle = '#8fe350';
            ctx.fillRect(capX + 1, capY, 3, capHeight);
            ctx.fillStyle = '#2e7d1e';
            ctx.fillRect(capX + capWidth - 3, capY, 3, capHeight);
            ctx.strokeRect(capX, capY, capWidth, capHeight);
        });
    }

    function updatePipes() {
        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= PIPE_SPEED;
            if (pipes[i].x + pipes[i].w < 0) pipes.splice(i, 1);
        }
        if (frames % PIPE_SPAWN_INTERVAL === 0 && gameState === 'play') createPipe();
    }

    function checkCollisions() {
        for (let i = 0; i < pipes.length; i++) {
            const p = pipes[i];
            const bx = bird.x + 1, by = bird.y + 1;
            const bw = bird.width - 2, bh = bird.height - 2;
            if (bx < p.x + p.w && bx + bw > p.x && by < p.y + p.h && by + bh > p.y) {
                gameOver();
                return;
            }
            if (p.x + p.w < bird.x && !p.passed) {
                p.passed = true;
                if (p.y === 0) { score++; sfxScore(); }
            }
        }
    }

    // === ФОН ===
    function drawBackground() {
        const groundY = logicalHeight - GROUND_HEIGHT;

        let skyColors, hillColors, treeColors, groundColors;
        
        if (settings.theme === 'night') {
            skyColors = ['#0a1628', '#0f1e3a', '#15284d', '#1c3260', '#233c73', '#2a4685', '#314f97', '#3a5aa8', '#4464b5', '#4e6ec0', '#5878ca', '#6282d3'];
            hillColors = ['#2a3d5c', '#1f2f4a', '#152239'];
            treeColors = ['#1a2a1a', '#243824', '#152219'];
            groundColors = ['#4a4030', '#3a3224', '#2a2518'];
        } else {
            skyColors = ['#3d7bbf', '#4a8aca', '#5a99d5', '#6ba8df', '#7fb7e8', '#93c5ee', '#a8d2f2', '#bddff5', '#d1eaf8', '#e2f1f8', '#f0f5f5', '#fce4d0'];
            hillColors = ['#a3c9e8', '#7ba8c9', '#5cb82e'];
            treeColors = ['#4a7a3a', '#5a8a4a', '#3d6a30'];
            groundColors = ['#e8dfa0', '#ded895', '#c9c07a'];
        }

        const skyHeight = groundY / skyColors.length;
        for (let i = 0; i < skyColors.length; i++) {
            ctx.fillStyle = skyColors[i];
            ctx.fillRect(0, i * skyHeight, logicalWidth, skyHeight + 1);
        }

        const sunX = logicalWidth - 40;
        const sunY = 30;
        
        if (settings.theme === 'night') {
            ctx.fillStyle = 'rgba(200, 220, 255, 0.15)';
            drawPixelCircle(sunX, sunY, 20);
            ctx.fillStyle = '#f0f0ff';
            drawPixelCircle(sunX, sunY, 8);
            ctx.fillStyle = '#c0c0e0';
            drawPixelCircle(sunX - 2, sunY - 2, 2);
            drawPixelCircle(sunX + 3, sunY + 1, 1);
            
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 20; i++) {
                const sx = (i * 37 + frames * 0.05) % logicalWidth;
                const sy = (i * 13) % (groundY - 30);
                if (Math.sin(frames * 0.1 + i) > 0) ctx.fillRect(Math.floor(sx), Math.floor(sy), 1, 1);
            }
        } else {
            ctx.fillStyle = 'rgba(255, 240, 180, 0.15)';
            drawPixelCircle(sunX, sunY, 22);
            ctx.fillStyle = 'rgba(255, 240, 180, 0.25)';
            drawPixelCircle(sunX, sunY, 16);
            ctx.fillStyle = 'rgba(255, 245, 200, 0.4)';
            drawPixelCircle(sunX, sunY, 11);
            ctx.fillStyle = '#ffe666';
            drawPixelCircle(sunX, sunY, 8);
            ctx.fillStyle = '#fff4a3';
            drawPixelCircle(sunX, sunY, 6);
            ctx.fillStyle = '#fff';
            drawPixelCircle(sunX, sunY, 3);
        }

        ctx.fillStyle = settings.theme === 'night' ? 'rgba(200, 220, 255, 0.4)' : 'rgba(255, 245, 180, 0.5)';
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2 + frames * 0.005;
            const dist = 14 + Math.sin(frames * 0.05 + i) * 2;
            const rx = sunX + Math.cos(angle) * dist;
            const ry = sunY + Math.sin(angle) * dist;
            ctx.fillRect(Math.floor(rx), Math.floor(ry), 2, 2);
        }

        const cloudColor = settings.theme === 'night' ? 'rgba(80, 100, 140, 0.7)' : 'rgba(255, 255, 255, 0.95)';
        drawCloud((frames * 0.15) % (logicalWidth + 100) - 50, 18, 1.0, cloudColor);
        drawCloud((frames * 0.2 + 60) % (logicalWidth + 100) - 50, 28, 0.8, cloudColor);
        drawCloud((frames * 0.12 + 130) % (logicalWidth + 100) - 50, 42, 1.2, cloudColor);
        drawCloud((frames * 0.25 + 200) % (logicalWidth + 100) - 50, 12, 0.7, cloudColor);

        const hill1Offset = (frames * 0.1) % 80;
        ctx.fillStyle = hillColors[0];
        for (let i = -1; i < logicalWidth / 80 + 2; i++) {
            drawSoftHill(i * 80 - hill1Offset, groundY, 80, 35);
        }

        const hill2Offset = (frames * 0.2) % 60;
        ctx.fillStyle = hillColors[1];
        for (let i = -1; i < logicalWidth / 60 + 2; i++) {
            drawSoftHill(i * 60 - hill2Offset, groundY, 60, 28);
        }

        const treeOffset = (frames * 0.35) % 30;
        for (let i = -1; i < logicalWidth / 30 + 2; i++) {
            const tx = i * 30 - treeOffset;
            const t = i % 3;
            if (t === 0) drawPineTree(tx, groundY - 5, treeColors[0]);
            else if (t === 1) drawRoundTree(tx, groundY - 5, treeColors[1]);
            else drawPineTree(tx + 15, groundY - 5, treeColors[2]);
        }

        const hill3Offset = (frames * 0.5) % 50;
        ctx.fillStyle = hillColors[2];
        for (let i = -1; i < logicalWidth / 50 + 2; i++) {
            drawSoftHill(i * 50 - hill3Offset, groundY, 50, 22);
        }

        const bushOffset = (frames * PIPE_SPEED) % 20;
        for (let i = -1; i < logicalWidth / 20 + 2; i++) {
            drawBush(i * 20 - bushOffset, groundY, settings.theme === 'night');
        }

        const groundGrad = ctx.createLinearGradient(0, groundY, 0, logicalHeight);
        groundGrad.addColorStop(0, groundColors[0]);
        groundGrad.addColorStop(0.5, groundColors[1]);
        groundGrad.addColorStop(1, groundColors[2]);
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, logicalWidth, GROUND_HEIGHT);

        if (settings.theme === 'night') {
            ctx.fillStyle = '#1a3a10';
            ctx.fillRect(0, groundY, logicalWidth, 1);
            ctx.fillStyle = '#2a5a1e';
            ctx.fillRect(0, groundY + 1, logicalWidth, 2);
        } else {
            ctx.fillStyle = '#3a8a1e';
            ctx.fillRect(0, groundY, logicalWidth, 1);
            ctx.fillStyle = '#5cb82e';
            ctx.fillRect(0, groundY + 1, logicalWidth, 2);
            ctx.fillStyle = '#8fe350';
            ctx.fillRect(0, groundY + 1, logicalWidth, 1);
        }

        const grassOffset = (frames * PIPE_SPEED) % 8;
        ctx.fillStyle = settings.theme === 'night' ? '#2a5a1e' : '#5cb82e';
        for (let i = -8; i < logicalWidth + 8; i += 4) {
            const gx = i - grassOffset;
            const gh = 2 + (i % 3);
            ctx.fillRect(gx, groundY - gh, 1, gh);
        }
    }

    function drawPixelCircle(cx, cy, r) {
        for (let y = -r; y <= r; y++) {
            for (let x = -r; x <= r; x++) {
                if (x * x + y * y <= r * r) ctx.fillRect(cx + x, cy + y, 1, 1);
            }
        }
    }

    function drawSoftHill(x, groundY, width, height) {
        const steps = 20;
        for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const y = groundY - Math.sin(t * Math.PI) * height;
            ctx.fillRect(x + t * width, y, width / steps + 1, groundY - y);
        }
    }

    function drawCloud(x, y, size, color) {
        ctx.fillStyle = color || 'rgba(255, 255, 255, 0.95)';
        const s = size;
        const parts = [
            { dx: 0, dy: 0, w: 8 * s, h: 4 * s },
            { dx: 3 * s, dy: -2 * s, w: 8 * s, h: 4 * s },
            { dx: 8 * s, dy: -3 * s, w: 10 * s, h: 5 * s },
            { dx: 14 * s, dy: -1 * s, w: 8 * s, h: 4 * s },
            { dx: 20 * s, dy: 0, w: 7 * s, h: 3 * s },
            { dx: 4 * s, dy: 2 * s, w: 14 * s, h: 3 * s },
        ];
        parts.forEach(p => {
            ctx.fillRect(Math.floor(x + p.dx), Math.floor(y + p.dy), Math.ceil(p.w), Math.ceil(p.h));
        });
    }

    function drawPineTree(x, baseY, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x + 2, baseY - 3, 2, 3);
        ctx.fillRect(x, baseY - 8, 6, 2);
        ctx.fillRect(x + 1, baseY - 10, 4, 2);
        ctx.fillRect(x + 2, baseY - 12, 2, 2);
    }

    function drawRoundTree(x, baseY, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x + 3, baseY - 4, 2, 4);
        ctx.fillRect(x, baseY - 10, 8, 5);
        ctx.fillRect(x + 1, baseY - 12, 6, 3);
    }

    function drawBush(x, groundY, isNight) {
        ctx.fillStyle = isNight ? '#1a3a10' : '#3d8a1e';
        ctx.fillRect(x, groundY - 5, 10, 5);
        ctx.fillRect(x + 2, groundY - 7, 6, 3);
        ctx.fillRect(x + 4, groundY - 8, 3, 2);
        ctx.fillStyle = isNight ? '#2a5a1e' : '#5cb82e';
        ctx.fillRect(x + 1, groundY - 5, 3, 2);
        ctx.fillRect(x + 3, groundY - 7, 2, 1);
    }

    function drawScore() {
        ctx.fillStyle = '#000';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.strokeText(score, logicalWidth / 2, 40);
        ctx.fillText(score, logicalWidth / 2, 40);
    }

    function drawUI() {
        if (gameState === 'ready') {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);
            ctx.fillStyle = '#fff';
            ctx.font = '12px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.strokeText('GET READY', logicalWidth / 2, logicalHeight / 2 - 10);
            ctx.fillText('GET READY', logicalWidth / 2, logicalHeight / 2 - 10);
            ctx.font = '8px "Press Start 2P"';
            ctx.fillStyle = '#f7d51d';
            ctx.fillText('CLICK OR SPACE', logicalWidth / 2, logicalHeight / 2 + 15);
        }

        if (gameState === 'paused') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);
            ctx.fillStyle = '#f7d51d';
            ctx.font = '18px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.strokeText('PAUSED', logicalWidth / 2, logicalHeight / 2);
            ctx.fillText('PAUSED', logicalWidth / 2, logicalHeight / 2);
        }

        if (gameState === 'over') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);
            ctx.fillStyle = '#ff4444';
            ctx.font = '16px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.strokeText('GAME OVER', logicalWidth / 2, logicalHeight / 2 - 30);
            ctx.fillText('GAME OVER', logicalWidth / 2, logicalHeight / 2 - 30);
            ctx.fillStyle = '#fff';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('SCORE: ' + score, logicalWidth / 2, logicalHeight / 2 + 5);
            ctx.fillText('BEST: ' + (localStorage.getItem('flappyBest') || 0), logicalWidth / 2, logicalHeight / 2 + 25);
            ctx.font = '8px "Press Start 2P"';
            ctx.fillStyle = '#f7d51d';
            ctx.fillText('CLICK TO RESTART', logicalWidth / 2, logicalHeight / 2 + 50);
        }
    }

    function gameOver() {
        if (gameState !== 'over') {
            gameState = 'over';
            sfxHit();
            stopMusic();
            const best = parseInt(localStorage.getItem('flappyBest') || 0);
            if (score > best) localStorage.setItem('flappyBest', score);
        }
    }

    function resetGame() {
        stopMusic();
        gameState = 'ready';
        score = 0;
        frames = 0;
        pipes.length = 0;
        bird.y = 50;
        bird.velocity = 0;
        bird.rotation = 0;
        bird.frame = 0;
    }

    // === ГЛАВНЫЙ ЦИКЛ (защита от зависания) ===
    function loop() {
        requestAnimationFrame(loop); // ВАЖНО: в самом начале
        try {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
            ctx.imageSmoothingEnabled = false;
            
            drawBackground();
            
            if (gameState === 'play') {
                updatePipes();
                checkCollisions();
            }
            
            drawPipes();
            bird.update();
            bird.draw();
            drawScore();
            drawUI();
            
            frames++;
        } catch(e) {
            console.error('LOOP ERROR:', e);
        }
    }

    // === УПРАВЛЕНИЕ ===
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState !== 'paused') bird.jump();
        }
        if (e.code === 'Escape') togglePause();
    });

    canvas.addEventListener('mousedown', function(e) {
        e.preventDefault();
        if (gameState !== 'paused') bird.jump();
    });
    
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (gameState !== 'paused') bird.jump();
    }, {passive: false});

    // === КНОПКИ ===
    document.getElementById('fullscreenBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        sfxClick();
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    });

    document.getElementById('pauseBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        sfxClick();
        togglePause();
    });

    function togglePause() {
        if (gameState === 'play' || gameState === 'ready') {
            prevGameState = gameState;
            gameState = 'paused';
            stopMusic();
        } else if (gameState === 'paused') {
            gameState = prevGameState;
            if (settings.music && gameState === 'play') startMusic();
        }
    }

    document.getElementById('settingsBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        sfxClick();
        document.getElementById('settingsMenu').classList.add('active');
        if (gameState === 'play') {
            prevGameState = gameState;
            gameState = 'paused';
            stopMusic();
        }
    });

    document.getElementById('closeSettings').addEventListener('click', function(e) {
        e.stopPropagation();
        sfxClick();
        document.getElementById('settingsMenu').classList.remove('active');
        if (gameState === 'paused') {
            gameState = prevGameState;
            if (settings.music && gameState === 'play') startMusic();
        }
    });

    document.getElementById('musicToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        settings.music = !settings.music;
        this.textContent = settings.music ? 'ON' : 'OFF';
        this.classList.toggle('off', !settings.music);
        saveSettings();
        sfxClick();
        if (settings.music && (gameState === 'play' || gameState === 'ready')) {
            startMusic();
        } else {
            stopMusic();
        }
    });

    document.getElementById('sfxToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        settings.sfx = !settings.sfx;
        this.textContent = settings.sfx ? 'ON' : 'OFF';
        this.classList.toggle('off', !settings.sfx);
        saveSettings();
        sfxClick();
    });

    document.getElementById('themeToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        settings.theme = settings.theme === 'day' ? 'night' : 'day';
        this.textContent = settings.theme.toUpperCase();
        saveSettings();
        sfxClick();
    });

    document.getElementById('diffToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        const order = ['easy', 'normal', 'hard'];
        const idx = order.indexOf(settings.difficulty);
        settings.difficulty = order[(idx + 1) % 3];
        this.textContent = settings.difficulty.toUpperCase();
        applyDifficulty();
        saveSettings();
        sfxClick();
    });

    function updateSettingsUI() {
        document.getElementById('musicToggle').textContent = settings.music ? 'ON' : 'OFF';
        document.getElementById('musicToggle').classList.toggle('off', !settings.music);
        document.getElementById('sfxToggle').textContent = settings.sfx ? 'ON' : 'OFF';
        document.getElementById('sfxToggle').classList.toggle('off', !settings.sfx);
        document.getElementById('themeToggle').textContent = settings.theme.toUpperCase();
        document.getElementById('diffToggle').textContent = settings.difficulty.toUpperCase();
    }

    // === ИНИЦИАЛИЗАЦИЯ ===
    applyDifficulty();
    loadSettings();
    updateMusicIndicator();
    
    function firstInteraction() {
        initAudio();
        document.removeEventListener('mousedown', firstInteraction);
        document.removeEventListener('touchstart', firstInteraction);
        document.removeEventListener('keydown', firstInteraction);
    }
    
    document.addEventListener('mousedown', firstInteraction);
    document.addEventListener('touchstart', firstInteraction);
    document.addEventListener('keydown', firstInteraction);

    loop();

</script>
</body>
